; Kopiere diese Datei zu config.ini und trage deine echten Werte ein.
; config.ini selbst wird NICHT ins Git-Repo eingecheckt (siehe .gitignore).

[wled]
; IP-Adresse deines ESP32 (WLED Web-UI -> Info)
ip = 192.168.1.50
; Standard-Port fuer WLED Audio-Sync, i.d.R. nicht aendern
port = 11988

[audio]
sample_rate = 44100
block_size = 1024
num_fft_bins = 16

; Empfindlichkeit / Skalierung -- nach dem ersten Testlauf feinjustieren
gain = 30.0
peak_threshold = 0.35
peak_hold_ms = 100
